<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flood Monitoring Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-10">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">🌊 Flood Monitoring Dashboard</h1>
      <button onclick="window.location.reload()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-4 py-1.5 rounded-lg font-medium transition-all">🔄 รีเฟรช</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">

    <!-- แบนเนอร์สถานะเตือนภัย -->
    <div id="status-card" class="rounded-2xl p-6 text-white shadow-lg bg-slate-700 transition-all duration-300">
      <div class="text-center space-y-1">
        <p class="text-sm opacity-90">🚨 สถานะระดับน้ำ</p>
        <h2 id="status-title" class="text-3xl font-extrabold">กำลังโหลดข้อมูล...</h2>
        <p id="status-subtitle" class="text-sm opacity-90 mt-1">ระดับ - | ระยะห่าง - cm</p>
      </div>
    </div>

    <!-- การ์ดตัวเลข 3 ช่อง -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-center">
        <p class="text-slate-500 text-sm font-medium flex items-center gap-1">📡 ระยะห่างจากเซนเซอร์</p>
        <p class="mt-2 text-3xl font-bold text-slate-900"><span id="distance">0.0</span> <span class="text-base font-normal text-slate-500">cm</span></p>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-center">
        <p class="text-slate-500 text-sm font-medium flex items-center gap-1">🌊 ระดับน้ำ</p>
        <p class="mt-2 text-3xl font-bold text-slate-900"><span id="status-level-text">ระดับ -</span></p>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-center">
        <p class="text-slate-500 text-sm font-medium flex items-center gap-1">🕒 อัปเดตล่าสุด</p>
        <p id="last-updated" class="mt-2 text-lg font-bold text-slate-700">-</p>
      </div>
    </div>

    <!-- ส่วนเลือกช่วงข้อมูล -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h3 class="font-bold text-slate-800 flex items-center gap-2">📅 เลือกช่วงข้อมูล</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        <div>
          <label class="block text-xs text-slate-500 font-medium mb-1">วันที่เริ่มต้น</label>
          <input type="date" id="start-date" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 font-medium mb-1">วันที่สิ้นสุด</label>
          <input type="date" id="end-date" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <button id="btn-filter" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition-colors flex items-center justify-center gap-1">🔍 แสดงข้อมูล</button>
        </div>
      </div>
    </div>

    <!-- กราฟแสดงระดับน้ำ -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h3 class="font-bold text-slate-800 flex items-center gap-2">📈 กราฟระดับน้ำ</h3>
      <div class="w-full h-64 md:h-80">
        <canvas id="waterChart"></canvas>
      </div>
    </div>

    <!-- ตารางประวัติระดับน้ำ -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 font-bold text-slate-800 flex items-center gap-2">💾 ประวัติระดับน้ำ</div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-slate-700 font-medium text-xs border-b border-slate-100">
            <tr>
              <th class="px-6 py-3">วัน/เวลา</th>
              <th class="px-6 py-3">ระยะห่าง</th>
              <th class="px-6 py-3">ระดับน้ำ</th>
              <th class="px-6 py-3">สถานะ</th>
            </tr>
          </thead>
          <tbody id="history-table" class="divide-y divide-slate-100">
            <tr><td colspan="4" class="px-6 py-4 text-center text-slate-400">กำลังดึงข้อมูล...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Firebase & Chart Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://ruokmm-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // สร้าง Chart.js
    const ctx = document.getElementById('waterChart').getContext('2d');
    const waterChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'ระดับน้ำ',
          data: [],
          borderColor: '#0284c7',
          backgroundColor: 'rgba(2, 132, 199, 0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 4,
          pointHoverRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            min: 0,
            max: 3,
            ticks: {
              stepSize: 1,
              callback: function(value) { return 'ระดับ ' + value; }
            }
          }
        }
      }
    });

    const logsRef = query(ref(database, '/'), limitToLast(20));

    onValue(logsRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const items = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
      const latest = items[0];

      if (latest) {
        const distance = Number(latest.distance_cm || latest.distance || 0);
        const levelState = Number(latest.level_state || latest.level || 1);
        const statusText = latest.status_text || latest.status || "ปกติ";
        const timeStr = latest.timestamp ? new Date(latest.timestamp).toLocaleString('th-TH') : new Date().toLocaleString('th-TH');

        document.getElementById("distance").innerText = distance.toFixed(1);
        document.getElementById("status-level-text").innerText = "ระดับ " + levelState;
        document.getElementById("status-title").innerText = statusText === "ปกติ" ? "ระดับน้ำปกติ" : (levelState === 3 ? "ระดับน้ำอันตราย" : "ระดับน้ำเฝ้าระวัง");
        document.getElementById("status-subtitle").innerText = `ระดับน้ำ ${levelState} | ระยะห่าง ${distance.toFixed(1)} cm`;
        document.getElementById("last-updated").innerText = timeStr;

        const card = document.getElementById("status-card");
        if (levelState === 3) card.className = "rounded-2xl p-6 text-white shadow-lg bg-red-600";
        else if (levelState === 2) card.className = "rounded-2xl p-6 text-white shadow-lg bg-amber-500";
        else card.className = "rounded-2xl p-6 text-white shadow-lg bg-emerald-600";

        // อัปเดตข้อมูลตารางและกราฟ
        const tableBody = document.getElementById("history-table");
        tableBody.innerHTML = "";
        
        const chartLabels = [];
        const chartData = [];

        [...items].reverse().forEach(item => {
          const d = Number(item.distance_cm || item.distance || 0);
          const l = Number(item.level_state || item.level || 1);
          const s = item.status_text || item.status || "ปกติ";
          const t = item.timestamp ? new Date(item.timestamp).toLocaleTimeString('th-TH') : new Date().toLocaleTimeString('th-TH');

          chartLabels.push(t);
          chartData.push(l);

          let badge = "bg-emerald-500 text-white";
          if (l === 3) badge = "bg-red-500 text-white";
          else if (l === 2) badge = "bg-amber-100 text-amber-800";

          tableBody.innerHTML += `
            <tr class="hover:bg-slate-50 border-b border-slate-100">
              <td class="px-6 py-3 font-medium text-slate-600">${t}</td>
              <td class="px-6 py-3">${d.toFixed(1)} cm</td>
              <td class="px-6 py-3 font-semibold">ระดับ ${l}</td>
              <td class="px-6 py-3"><span class="px-3 py-1 rounded-full text-xs font-bold ${badge}">${s}</span></td>
            </tr>
          `;
        });

        waterChart.data.labels = chartLabels;
        waterChart.data.datasets[0].data = chartData;
        waterChart.update();
      }
    });
  </script>
</body>
</html>
