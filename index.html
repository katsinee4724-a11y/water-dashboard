<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเฝ้าระวังระดับน้ำ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">🌊 ระบบติดตามระดับน้ำ Realtime</h1>
      <span class="text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full animate-pulse">● เชื่อมต่อสด</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">

    <!-- Card แสดงสถานะหลัก -->
    <div id="status-card" class="rounded-2xl p-6 text-white shadow-lg transition-all duration-300 bg-slate-700">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-sm opacity-80 uppercase tracking-wider">สถานะปัจจุบัน</p>
          <h2 id="status-title" class="text-3xl font-bold mt-1">กำลังโหลดข้อมูล...</h2>
        </div>
        <div class="text-right">
          <p class="text-sm opacity-80">ระดับ</p>
          <p id="status-level" class="text-4xl font-extrabold">-</p>
        </div>
      </div>
    </div>

    <!-- Cards แสดงตัวเลข -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <p class="text-slate-500 text-sm font-medium">ระดับน้ำปัจจุบัน</p>
        <p class="mt-2 text-4xl font-bold text-slate-900"><span id="water-level">0.0</span> <span class="text-base font-normal text-slate-500">ซม.</span></p>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <p class="text-slate-500 text-sm font-medium">ระยะห่างเซนเซอร์</p>
        <p class="mt-2 text-4xl font-bold text-slate-900"><span id="distance">0.0</span> <span class="text-base font-normal text-slate-500">ซม.</span></p>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <p class="text-slate-500 text-sm font-medium">อัปเดตล่าสุด</p>
        <p id="last-updated" class="mt-4 text-lg font-semibold text-slate-700">-</p>
      </div>
    </div>

    <!-- ตารางประวัติ -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 font-bold text-slate-800">📋 ประวัติการวัดล่าสุด</div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-slate-700 font-medium uppercase text-xs">
            <tr>
              <th class="px-6 py-3">ระยะเซนเซอร์</th>
              <th class="px-6 py-3">ระดับน้ำ</th>
              <th class="px-6 py-3">ระดับสถานะ</th>
              <th class="px-6 py-3">สถานะ</th>
            </tr>
          </thead>
          <tbody id="history-table" class="divide-y divide-slate-100">
            <tr><td colspan="4" class="px-6 py-4 text-center text-slate-400">กำลังดึงข้อมูล...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://ruokmm-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const logsRef = query(ref(database, '/'), limitToLast(10));

    onValue(logsRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const items = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
      const latest = items[0];

      if (latest) {
        const distance = Number(latest.distance_cm || latest.distance || 0);
        const waterLevel = Number(latest.water_level_cm || latest.waterLevel || 0);
        const levelState = Number(latest.level_state || latest.level || 1);
        const statusText = latest.status_text || latest.status || "ปกติ";

        document.getElementById("distance").innerText = distance.toFixed(1);
        document.getElementById("water-level").innerText = waterLevel.toFixed(1);
        document.getElementById("status-level").innerText = levelState;
        document.getElementById("status-title").innerText = statusText;
        document.getElementById("last-updated").innerText = new Date().toLocaleTimeString('th-TH') + " น.";

        const card = document.getElementById("status-card");
        if (levelState === 3) card.className = "rounded-2xl p-6 text-white shadow-lg bg-red-600";
        else if (levelState === 2) card.className = "rounded-2xl p-6 text-white shadow-lg bg-amber-500";
        else card.className = "rounded-2xl p-6 text-white shadow-lg bg-emerald-600";

        const tableBody = document.getElementById("history-table");
        tableBody.innerHTML = "";
        items.forEach(item => {
          const d = Number(item.distance_cm || item.distance || 0);
          const w = Number(item.water_level_cm || item.waterLevel || 0);
          const l = Number(item.level_state || item.level || 1);
          const s = item.status_text || item.status || "ปกติ";

          let badge = "bg-emerald-100 text-emerald-800";
          if (l === 3) badge = "bg-red-100 text-red-800";
          else if (l === 2) badge = "bg-amber-100 text-amber-800";

          tableBody.innerHTML += `
            <tr class="hover:bg-slate-50">
              <td class="px-6 py-4 font-medium">${d.toFixed(1)} cm</td>
              <td class="px-6 py-4 font-semibold text-slate-800">${w.toFixed(1)} cm</td>
              <td class="px-6 py-4">ระดับ ${l}</td>
              <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badge}">${s}</span></td>
            </tr>
          `;
        });
      }
    });
  </script>
</body>
</html>
